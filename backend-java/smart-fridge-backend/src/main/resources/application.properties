spring.application.name=smart-fridge-backend
server.port=8080

# Secrets live in a git-ignored .env file (see .env.example), not in source control.
# "optional:" means the app still starts if the file is missing (e.g. in CI, where
# real environment variables are used instead).
spring.config.import=optional:file:.env[.properties]

# PostgreSQL connection
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fridge_db}
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD:}

# Flyway owns the schema. Your existing database was built by hand from the
# DBeaver scripts, so we tell Flyway "treat it as already at V2" the first time;
# from then on only newer migrations (V3, V4, ...) are applied.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=2

# JPA / Hibernate
# 'validate' = Hibernate checks the entities match the tables at startup and
# refuses to start if they don't. It never changes the schema; Flyway does that.
spring.jpa.hibernate.ddl-auto=validate
# Close the DB session when the service method ends instead of keeping it open
# for the whole HTTP request (avoids hidden lazy-loading queries in controllers).
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Fridge rules
# Items expiring within this many days are treated as "use soon" in suggestions.
fridge.expiring-soon-days=3
